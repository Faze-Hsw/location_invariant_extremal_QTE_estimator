# =================================================================
# Data generation config: QTE confidence interval simulation experiment.
# Source: DGP based on Zhang (2018).
# =================================================================

experiment:
  random_seed: 20260101

# -----------------------------------------------------------------
# 1. Data generation (DGP)
# -----------------------------------------------------------------
data_generation:
  covariate:
    name: X
    distribution: uniform
    low: 0.0
    high: 1.0
  unobserved:
    name: U
    distribution: uniform
    low: 0.0
    high: 1.0

# -----------------------------------------------------------------
# 2. Treatment assignment
# -----------------------------------------------------------------
treatment:
  name: D
  rule: "D = 1{U <= Pi(X)}"
  propensity_score:
    # Pi(x) = a + b*x + c*x^2 = 0.25 + 0.5*x^2
    coefficients:
      constant: 0.25
      linear: 0.0
      quadratic: 0.5

# -----------------------------------------------------------------
# 3. Outcome models
# -----------------------------------------------------------------
outcome_models:

  H1:
    description: "Linear model + Student-t noise (heavy-tailed)"
    Y1:
      formula: "5 * S * (1 + X)"
    Y0:
      formula: "1 * S * (1 + X)"
    noise:
      variable: S
      distribution: student_t
      df: 3
    evi:                 # theoretical extreme value index (used to validate the estimators)
      gamma_1: 0.3333    # 1/3
      gamma_0: 0.3333    # 1/3

  H2:
    description: "Exponential model + Frechet noise (heavy-tailed)"
    Y1:
      formula: "C2 * exp(X)"
      noise:
        variable: C2
        distribution: frechet
        shape: 2
        loc: 0.0
        scale: 1.0
    Y0:
      formula: "C3 * exp(X)"
      noise:
        variable: C3
        distribution: frechet
        shape: 3
        loc: 0.0
        scale: 1.0
    evi:
      gamma_1: 0.5       # 1/2  (shape=2)
      gamma_0: 0.3333    # 1/3  (shape=3)

  H3:
    description: "Pareto model (heavy-tailed, conditional shape parameter depends on covariates)"
    # Note: shape is a conditional parameter (varies with X); the marginal EVI is
    #       determined by the heaviest-tailed component = 1/min a(x) = 1/1.75 = 4/7
    #       (X has bounded support [0,1], minimum attained at X=0), so evi is fixed.
    Y1:
      distribution: pareto
      shape_formula: "1.75 + X"
      scale: 2.0
    Y0:
      distribution: pareto
      shape_formula: "1.75 + 5*X"
      scale: 1.0
    evi:
      gamma_1: 0.5714    # 4/7
      gamma_0: 0.5714    # 4/7

# -----------------------------------------------------------------
# 4. Experimental design
# -----------------------------------------------------------------
design:
  # sample size grid
  sample_sizes: [1000, 5000]

  # extreme quantile levels τ_n (functions of n, evaluated at runtime)
  quantile_levels:
    - name: "tau_n_1"
      formula: "5 / n"
    - name: "tau_n_2"
      formula: "1 / n"
    - name: "tau_n_3"
      formula: "5 / (n * log(n))"
    # intermediate quantile level α_n = k/n with k = n^{0.65} (equivalently α_n = n^{-0.35})
    - name: "alpha_n"
      formula: "n ** 0.65 / n"

  # hyperparameters for the adaptive k0 estimator (k0 = k^m, replacing the manually specified k0):
  #   k0_init_formula: initial k0* formula (default 2·k^{2/3}, k = n^{0.65} from alpha_n)
  #   k0_sigma:        the σ in m = m* - σ
  #   k0_m_lower:      lower bound for m (used when m* - σ falls below it)
  k0_init_formula: "2*(n ** 0.65) ** (2 / 3)"
  k0_sigma: 0.05
  k0_m_lower: 0.1
  # fixed k0 formula for Deuber_diff (k0 = k^(2/3), k = n^0.65 from alpha_n):
  # k0_deuber_diff = (n*alpha_n)^(2/3) is fixed and does not follow the adaptive
  # group-specific Fraga estimate; β_n^deuber_diff = k0_deuber_diff / n (evaluated
  # at runtime for the specific n).
  k0_deuber_diff_formula: "2*(n ** 0.65) ** (2 / 3)"

  # number of Monte Carlo replications: each scenario regenerates samples and
  # re-estimates independently
  replications: 1000

  # shared location shift μ list: added at the model level to the potential outcomes
  # Y(j) = μ + original distribution (identical across H1/H2/H3). The true QTE
  # = q_{Y1+μ}(τ) - q_{Y0+μ}(τ) is translation-invariant and does not depend on μ;
  # each μ yields one MSE used to examine the estimator's sensitivity to the location
  # change. Values should be set per the scale of each model's distribution.
  # (μ=0 is handled by default in code; shifts overrides it in the experiment)
  shifts: [0,10,20,30]

  # number of parallel worker processes (max_workers for ProcessPoolExecutor).
  num_workers: 10

# -----------------------------------------------------------------
# 5. Inference (confidence interval coverage experiment) settings
# -----------------------------------------------------------------
inference:
  # nominal confidence level 1-α: target value for the CI coverage experiment
  # (e.g. 0.9 → z_{0.95} normal critical value)
  confidence_level: 0.9
  # number of bootstrap resamples B: used to estimate the standard error of the
  # statistic (within each Monte Carlo replication)
  bootstrap_replications: 1000
