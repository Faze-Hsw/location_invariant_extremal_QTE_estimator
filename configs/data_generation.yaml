# =================================================================
# 数据生成配置：QTE 置信区间模拟实验
# 来源：基于 Zhang (2018) 的 DGP
# 注：inference（置信水平、Bootstrap、Monte Carlo）参数暂未写入
# =================================================================

experiment:
  random_seed: 20260101

# -----------------------------------------------------------------
# 1. 数据生成 (DGP)
# -----------------------------------------------------------------
data_generation:
  covariate:
    name: X
    distribution: uniform
    low: 0.0
    high: 1.0
  unobserved:
    name: U
    distribution: uniform
    low: 0.0
    high: 1.0

# -----------------------------------------------------------------
# 2. 处理分配 (Treatment Assignment)
# -----------------------------------------------------------------
treatment:
  name: D
  rule: "D = 1{U <= Pi(X)}"
  propensity_score:
    # Pi(x) = a + b*x + c*x^2 = 0.25 + 0.5*x^2
    coefficients:
      constant: 0.25
      linear: 0.0
      quadratic: 0.5

# -----------------------------------------------------------------
# 3. 结果模型 (Outcome Models)
# -----------------------------------------------------------------
outcome_models:

  H1:
    description: "线性模型 + Student-t 噪声（重尾）"
    Y1:
      formula: "5 * S * (1 + X)"
    Y0:
      formula: "1 * S * (1 + X)"
    noise:
      variable: S
      distribution: student_t
      df: 3
    evi:                 # 理论极值指数（用于后续验证估计量）
      gamma_1: 0.3333    # 1/3
      gamma_0: 0.3333    # 1/3

  H2:
    description: "指数模型 + Frechet 噪声（重尾）"
    Y1:
      formula: "C2 * exp(X)"
      noise:
        variable: C2
        distribution: frechet
        shape: 2
        loc: 0.0
        scale: 1.0
    Y0:
      formula: "C3 * exp(X)"
      noise:
        variable: C3
        distribution: frechet
        shape: 3
        loc: 0.0
        scale: 1.0
    evi:
      gamma_1: 0.5       # 1/2  (对应 shape=2)
      gamma_0: 0.3333    # 1/3  (对应 shape=3)

  H3:
    description: "Pareto 模型（重尾，条件形状参数依赖协变量）"
    # 注：shape 为条件参数（随 X 变化）；边际 EVI 由最重尾成分决定，
    #     = 1/min a(x) = 1/1.75 = 4/7（X 支撑有界[0,1]，最小值在 X=0 处取得），故 evi 固定。
    Y1:
      distribution: pareto
      shape_formula: "1.75 + X"
      scale: 2.0
    Y0:
      distribution: pareto
      shape_formula: "1.75 + 5*X"
      scale: 1.0
    evi:
      gamma_1: 0.5714    # 4/7
      gamma_0: 0.5714    # 4/7

# -----------------------------------------------------------------
# 4. 实验设计 (Experimental Design)
# -----------------------------------------------------------------
design:
  # 样本量网格
  sample_sizes: [1000, 2000, 5000]

  # 极端分位数水平 τ_n（n 的函数，运行时代入具体 n）
  quantile_levels:
    - name: "tau_n_1"
      formula: "5 / n"
    - name: "tau_n_2"
      formula: "1 / n"
    - name: "tau_n_3"
      formula: "5 / (n * log(n))"

  # 完整因子设计：3 模型 x 3 样本量 x 3 分位数 = 27 个场景
  full_factorial: true
