# =================================================================
# 数据生成配置：QTE 置信区间模拟实验
# 来源：基于 Zhang (2018) 的 DGP
# 注：inference（置信水平、Bootstrap、Monte Carlo）参数暂未写入
# =================================================================

experiment:
  random_seed: 20260101

# -----------------------------------------------------------------
# 1. 数据生成 (DGP)
# -----------------------------------------------------------------
data_generation:
  covariate:
    name: X
    distribution: uniform
    low: 0.0
    high: 1.0
  unobserved:
    name: U
    distribution: uniform
    low: 0.0
    high: 1.0

# -----------------------------------------------------------------
# 2. 处理分配 (Treatment Assignment)
# -----------------------------------------------------------------
treatment:
  name: D
  rule: "D = 1{U <= Pi(X)}"
  propensity_score:
    # Pi(x) = a + b*x + c*x^2 = 0.25 + 0.5*x^2
    coefficients:
      constant: 0.25
      linear: 0.0
      quadratic: 0.5

# -----------------------------------------------------------------
# 3. 结果模型 (Outcome Models)
# -----------------------------------------------------------------
outcome_models:

  H1:
    description: "线性模型 + Student-t 噪声（重尾）"
    Y1:
      formula: "5 * S * (1 + X)"
    Y0:
      formula: "1 * S * (1 + X)"
    noise:
      variable: S
      distribution: student_t
      df: 3
    evi:                 # 理论极值指数（用于后续验证估计量）
      gamma_1: 0.3333    # 1/3
      gamma_0: 0.3333    # 1/3

  H2:
    description: "指数模型 + Frechet 噪声（重尾）"
    Y1:
      formula: "C2 * exp(X)"
      noise:
        variable: C2
        distribution: frechet
        shape: 2
        loc: 0.0
        scale: 1.0
    Y0:
      formula: "C3 * exp(X)"
      noise:
        variable: C3
        distribution: frechet
        shape: 3
        loc: 0.0
        scale: 1.0
    evi:
      gamma_1: 0.5       # 1/2  (对应 shape=2)
      gamma_0: 0.3333    # 1/3  (对应 shape=3)

  H3:
    description: "Pareto 模型（重尾，条件形状参数依赖协变量）"
    # 注：shape 为条件参数（随 X 变化）；边际 EVI 由最重尾成分决定，
    #     = 1/min a(x) = 1/1.75 = 4/7（X 支撑有界[0,1]，最小值在 X=0 处取得），故 evi 固定。
    Y1:
      distribution: pareto
      shape_formula: "1.75 + X"
      scale: 2.0
    Y0:
      distribution: pareto
      shape_formula: "1.75 + 5*X"
      scale: 1.0
    evi:
      gamma_1: 0.5714    # 4/7
      gamma_0: 0.5714    # 4/7

# -----------------------------------------------------------------
# 4. 实验设计 (Experimental Design)
# -----------------------------------------------------------------
design:
  # 样本量网格
  sample_sizes: [1000, 5000]

  # 极端分位数水平 τ_n（n 的函数，运行时代入具体 n）
  quantile_levels:
    - name: "tau_n_1"
      formula: "5 / n"
    - name: "tau_n_2"
      formula: "1 / n"
    - name: "tau_n_3"
      formula: "5 / (n * log(n))"
    # 中间分位数水平 α_n = k/n，其中 k = n^{0.65}（等价写法 α_n = n^{-0.35}）
    - name: "alpha_n"
      formula: "n ** 0.65 / n"

  # k0 自适应估计超参数（k0 = k^m，取代手动指定 k0）：
  #   k0_init_formula: 初始取定的 k0* 公式（默认 2·k^{2/3}，k = n^{0.65} 来自 alpha_n）
  #   k0_sigma:        m = m* - σ 中的 σ
  #   k0_m_lower:      m 的下界兜底值（m* - σ < 该值时取该值）
  k0_init_formula: "2*(n ** 0.65) ** (2 / 3)"
  k0_sigma: 0.05
  k0_m_lower: 0.1
  # Deuber_diff 的固定 k0 公式（k0 = k^(2/3)，k = n^0.65 来自 alpha_n）：
  # 统一取 k0_deuber_diff = (n*alpha_n)^(2/3)，不随 Fraga 分组自适应估计；
  # β_n^deuber_diff = k0_deuber_diff / n（运行时代入具体 n）
  k0_deuber_diff_formula: "2*(n ** 0.65) ** (2 / 3)"

  # Monte Carlo 重复次数：每个场景独立重复生成样本并估计
  replications: 1000

  # 共享位置偏移 μ 列表：模型层外加到潜在结果 Y(j) = μ + 原分布（H1/H2/H3 一致）。
  # 真实 QTE = q_{Y1+μ}(τ) - q_{Y0+μ}(τ) 平移不变，不随 μ 变化；每个 μ 得到一个
  # MSE，用于考察估计量对位置变化的敏感性。取值需按各模型分布尺度设定。
  # （默认 μ=0 由代码缺省处理，实验时 shifts 覆盖）
  shifts: [0,10,20,30]

  # 并行 worker 进程数（ProcessPoolExecutor 的 max_workers）。
  num_workers: 10

# -----------------------------------------------------------------
# 5. 推断（置信区间覆盖率实验）设置
# -----------------------------------------------------------------
inference:
  # 名义置信水平 1-α：CI 覆盖率实验的目标值（如 0.9 → z_{0.95} 正态临界值）
  confidence_level: 0.9
  # Bootstrap 重采样次数 B：估计统计量标准误（每个 Monte Carlo 重复内）
  bootstrap_replications: 200
